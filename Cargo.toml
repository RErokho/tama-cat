[workspace]
resolver = "2"
members = [
  "crates/cat-core",
  "crates/cat-render",
  "crates/cat-platform",
  "crates/desktop-cat",
]
default-members = ["crates/desktop-cat"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Desktop Cat"]

[workspace.dependencies]
cat-core = { path = "crates/cat-core" }
cat-render = { path = "crates/cat-render" }
cat-platform = { path = "crates/cat-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_Graphics_Dwm",
] }
